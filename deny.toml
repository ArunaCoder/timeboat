# Configuração do `cargo deny` (`npm run deny`): licenças, advisories, duplicatas
# e origem das crates. A mesma régua do repositório tudolindo.

[graph]
# O app é só para Windows: dependências de outras plataformas não entram na
# checagem, o que evita falso positivo de licença/advisory de crate que nunca
# chega ao binário.
targets = ["x86_64-pc-windows-msvc"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Crate sem manutenção só reprova quando é dependência direta do workspace; na
# árvore transitiva do Tauri o aviso não teria ação possível daqui.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
  # Só as licenças que a árvore de fato usa: uma entrada que nenhuma crate usa aprovaria
  # de antemão, sem revisão, a primeira dependência nova que chegasse com ela.
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# As crates do próprio workspace têm `publish = false` e nenhuma licença declarada.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
